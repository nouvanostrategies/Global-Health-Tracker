<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PEPFAR & Global Health Outlays Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      color: #333;
    }
    h2 { margin-bottom: 5px; }
    p.subtitle { color: #666; margin-bottom: 30px; }
    .chart-container {
      position: relative;
      height: 420px;
      width: 100%;
      background: #fafafa;
      border: 1px solid #e1e4e8;
      border-radius: 8px;
      padding: 15px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <h2>U.S. Global Health & PEPFAR Funding Execution</h2>
  <p class="subtitle">Tracking Treasury Accounts: 019-1031 (State GHP), 072-1031 (USAID GHP), & 019-1030</p>

  <div class="chart-container" id="chartWrapper">
    <canvas id="tasChart"></canvas>
  </div>

  <script src="script.js"></script>
</body>
</html>
